[package]
name = "socd"
version = "0.1.0"
edition = "2021"
description = "SOCD (simultaneous opposite cardinal direction) key remapper for Windows"
license = "MIT"
repository = "https://github.com/GYIIDTF/socd"
readme = "README.md"
keywords = ["socd", "keymapper", "windows", "gaming"]
categories = ["games"]
build = "build.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_UI_Shell",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
